name: Gerar cobra de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00h (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobra
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF1744&color_dots=#ebedf0,#ffcdd2,#ef9a9a,#e53935,#8b0000
            dist/snake-dark.svg?color_snake=#FF1744&color_dots=#161b22,#4a0010,#8b0000,#d50000,#ff1744

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
